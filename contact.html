<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYRACUSE UNITED</title>
  <style>
    
    .contact-list {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 35px;
  margin-top: 30px;
  text-align: left;
}

.contact-details h2 {
  color: #65734f;
  font-size: 1rem;
  margin-bottom: 20px;
}

.contact-item {
  margin-bottom: 22px;
}

.contact-item h3 {
  font-size: 0.8rem;
  color: #273527;
  margin-bottom: 7px;
  text-transform: uppercase;
}

.contact-item p,
.contact-item a {
  font-size: 0.9rem;
  color: #555;
  line-height: 1.6;
  overflow-wrap: anywhere;
  text-decoration: none;
}

.contact-item a:hover {
  text-decoration: underline;
}
.contact-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
}

.contact-form label {
  font-size: 0.8rem;
  color: #273527;
  font-weight: bold;
  margin-top: 5px;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-family: Arial, sans-serif;
  font-size: 0.9rem;
}

.contact-form textarea {
  min-height: 100px;
  resize: vertical;
}

.contact-form button {
  background-color: #273527;
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 8px;
}

.contact-form button:hover {
  background-color: #465743;
}

@media (max-width: 600px) {
  main {
    padding: 25px 15px;
  }

  .card {
    padding: 25px 20px;
  }

  .contact-list {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  nav ul {
    gap: 15px;
    flex-wrap: wrap;
  }
}
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Times New Roman', Times, serif, sans-serif;
    }

    body {
      background-color: #d6d6d6;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #273527;
      color: #ffffff;
      padding: 15px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px; 
    }

    .brand-logo {
      width: 100px;       
      height: 45px;       
      border-radius: 10%; 
      object-fit: cover;
    }
    nav {
      background-color: #262c26;
      padding: 8px 0;
    }
    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 1px;
      font-weight: bold;
    }
    nav a.active, nav a:hover {
      color: #f8f5f5;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 2px;
    }

     main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 30px;
    }
    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 40px;
      max-width: 850px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .card {
       box-shadow: 0 10px 25px rgba(31, 153, 6, 0.2);
      }
    .card h1 {
      font-size: 1.5rem;
      letter-spacing: 1.5px;
      color: #2a3028;
      margin-bottom: 8px;
    }


    .card .subtitle {
      font-size: 0.9rem;
      color: #161d14;
      font-style: italic;
      margin-bottom: 25px;
    }

    .avatar-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #cbd2c8;
      border: 2px solid #a3ae9f;
    }

    .description {
      font-size: 0.85rem;
      color: #242323;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      background-color: #151d11;
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #282e27;
    }

    footer {
      background-color: #151d12;
      color: #c2c9bf;
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>


  <header>
    <div class="brand-title">
      
      <span>SYRACUSE UNITED</span>
    </div>
    <nav>
      <ul>

        <li><a href="about.html">ABOUT</a></li>
        <li><a href="gallery.html">GALLERY</a></li>
        <li><a href="contact.html" class="active">CONTACT</a></li>
      </ul>

    </nav>
  </header>

  <main>
  <div class="card">

    <h1>REACH US</h1>

    <p class="subtitle">
      Have a question or want to connect with Syracuse United?
      Reach us.
    </p>

    <div class="contact-list">

      <div class="contact-details">

        <h2>CONTACTS</h2>

        <div class="contact-item">
          <h3>Mobile Number</h3>

        <div class="contact-item">

          <a href="mailto:SyracastPH@email.com">

        <div class="contact-item">

  <footer>
    &copy; ERA OF 2027 - SYRACUSE UNITED
  </footer>

</html>
